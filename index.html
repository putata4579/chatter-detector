<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>잡담 탐지기</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }
        #status {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        #status-image {
            width: 300px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>실시간 잡담 탐지기</h1>
    <p id="status">모델을 불러오는 중입니다...</p>
    <img id="status-image" src="quiet.jpg" alt="상태 이미지">

    <!-- ✅ 올바른 tmAudio 라이브러리 경로 -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/audio@0.8.4/dist/teachablemachine-audio.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/zvC-4aSDG/";

        let recognizer;

        async function init() {
            const checkpointURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            recognizer = await tmAudio.load(checkpointURL, metadataURL);
            await recognizer.ensureModelLoaded();

            document.getElementById("status").innerText = "모델 로딩 완료! 감지 중...";
            predict();
        }

        async function predict() {
            const prediction = await recognizer.predict();
            let isChatter = false;

            prediction.forEach((p) => {
                if (p.className === "잡담" && p.probability > 0.85) {
                    isChatter = true;
                }
            });
